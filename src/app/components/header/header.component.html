<div class="topbar">
  <div class="container topbar-inner">
    <span>{{ store.hours }}</span>
    <span class="topbar-right">
      <a [href]="'tel:' + store.phone">Call {{ store.phone }}</a>
      <span class="dot" aria-hidden="true">•</span>
      <a [href]="'mailto:' + store.email">{{ store.email }}</a>
    </span>
  </div>
</div>

<header class="bar">
  <div class="container bar-inner">
    <a class="brand" routerLink="/" [attr.aria-label]="store.name + ' home'">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><path d="M4 15 16 5l12 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13v13h16V13" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M14 26v-7h4v7" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <strong>{{ store.name }}</strong>
        <small>{{ store.tagline }}</small>
      </span>
    </a>

    <form class="search" role="search" (submit)="$event.preventDefault(); onSearch(q.value)">
      <label for="site-search" class="sr-only">Search products</label>
      <input #q id="site-search" type="search" placeholder="Search cement, paint, pipes…"
             [value]="catalog.query()" (input)="catalog.search(q.value)" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </form>

    <nav class="nav" [class.open]="menuOpen()" (click)="menuOpen.set(false)">
      <a routerLink="/" fragment="categories">Categories</a>
      <a routerLink="/" fragment="catalog">All Products</a>
      <a routerLink="/order">Order Now</a>
      <a routerLink="/" fragment="contact">Contact</a>
    </nav>

    <div class="price-toggle" role="group" aria-label="Price type">
      <button type="button" [class.active]="price.mode() === 'cash'" (click)="price.set('cash')">Pick-up</button>
      <button type="button" [class.active]="price.mode() === 'term'" (click)="price.set('term')">Delivery</button>
    </div>

    <a class="cart-btn" routerLink="/order" [attr.aria-label]="'Your order, ' + cart.itemCount() + ' items'">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>
      @if (cart.itemCount()) {
        <span class="badge">{{ cart.itemCount() }}</span>
        <span class="cart-total">₱{{ cart.subtotal() | number: '1.0-0' }}</span>
      }
    </a>

    <button class="menu-btn" type="button" aria-label="Menu" (click)="menuOpen.set(!menuOpen())">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>
